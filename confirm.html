<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Kampuzz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #121116;
      color: #FFFCF7;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    a.btn {
      display: inline-block;
      background: #C1FF00;
      color: #121116;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.25rem;
      padding: 16px 28px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    p {
      max-width: 28rem;
      line-height: 1.4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <a class="btn" id="open" href="#">Open Kampuzz</a>
  <p>If the app didn't open, go back to Kampuzz and enter the 8-digit code from the email.</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var tokenHash = params.get('token_hash') || '';
      var type = params.get('type') || '';
      var deepLink = 'kampuzz://auth/callback?token_hash=' + encodeURIComponent(tokenHash) + '&type=' + encodeURIComponent(type);
      var btn = document.getElementById('open');
      btn.href = deepLink;
      window.location.href = deepLink;
    })();
  </script>
</body>
</html>
